        <script>
        (function() {
            let clickCount = 0;
            let markers = [];
            let mapReady = false;

            // Function to attach click handler
            function attachClickHandler() {
                if (typeof map !== 'undefined' && map) {
                    map.on('click', function(e) {
                        const lat = parseFloat(e.latlng.lat.toFixed(6));
                        const lng = parseFloat(e.latlng.lng.toFixed(6));

                        console.log('Map clicked:', lat, lng);

                        // Send message to parent window
                        if (window.parent && window.parent !== window) {
                            window.parent.postMessage(
                                {lat: lat, lng: lng},
                                "*"
                            );
                            console.log('Message sent to parent');
                        }

                        // Add marker
                        if (clickCount === 0) {
                            // Clear previous markers
                            markers.forEach(function(m) { map.removeLayer(m); });
                            markers = [];
                            
                            const marker = L.marker([lat, lng]).addTo(map);
                            marker.bindPopup("Start Point").openPopup();
                            markers.push(marker);
                            clickCount++;
                        } else if (clickCount === 1) {
                            const marker = L.marker([lat, lng]).addTo(map);
                            marker.bindPopup("End Point").openPopup();
                            markers.push(marker);
                            clickCount = 0; // Reset for next route
                        }
                    });
                    mapReady = true;
                    console.log('Click handler attached');
                }
            }

            // Try multiple times to attach handler
            function tryAttach() {
                if (!mapReady) {
                    attachClickHandler();
                    if (!mapReady) {
                        setTimeout(tryAttach, 200);
                    }
                }
            }

            // Start trying after a short delay
            setTimeout(tryAttach, 1000);
        })();
        </script>

<script>
// Click handler for map interaction
(function() {
    let clickCount = 0;
    let markers = [];
    
    function attachClickHandler() {
        // Find the map object - look for variables starting with 'map_'
        let mapObj = null;
        for (let key in window) {
            if (key.startsWith('map_') && window[key] && window[key].on) {
                mapObj = window[key];
                break;
            }
        }
        
        if (mapObj) {
            mapObj.off('click'); // Remove existing handlers
            
            mapObj.on('click', function(e) {
                const lat = parseFloat(e.latlng.lat.toFixed(6));
                const lng = parseFloat(e.latlng.lng.toFixed(6));
                
                console.log('Map clicked:', lat, lng);
                
                // Send to parent window
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({lat: lat, lng: lng}, "*");
                    console.log('Sent to parent:', lat, lng);
                }
                
                // Add marker
                if (clickCount === 0) {
                    markers.forEach(function(m) { mapObj.removeLayer(m); });
                    markers = [];
                    const marker = L.marker([lat, lng]).addTo(mapObj);
                    marker.bindPopup("Start Point").openPopup();
                    markers.push(marker);
                    clickCount++;
                } else {
                    const marker = L.marker([lat, lng]).addTo(mapObj);
                    marker.bindPopup("End Point").openPopup();
                    markers.push(marker);
                    clickCount = 0;
                }
            });
            
            console.log('Click handler attached!');
            return true;
        }
        return false;
    }
    
    // Try multiple times
    let attempts = 0;
    function tryAttach() {
        if (!attachClickHandler() && attempts < 20) {
            attempts++;
            setTimeout(tryAttach, 200);
        }
    }
    
    setTimeout(tryAttach, 1000);
})();
</script>
